<!DOCTYPE html>
<html lang="pt-BR">

<body style="background-color: rgb(42, 14, 14); color: rgb(245, 230, 211);">
    <h1>Formulário</h1>
    <form>
        <label for="nome">Nome completo:</label><br>
        <input type="text"
                id="Nome"
                placeholder="Digite seu nome"
                autofocus
                required
                minlength="3"
                maxlength="50"
                autocomplete="name"
        />

        <br>

        <label for="cpf">CPF:</label><br>
        <input type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                title="Digite o CPF no formato: 000.000.000-00"
        />

        <br>

        <label for="nascimento">Data Nascimento:</label><br>
        <input type="date"
                id="nascimento"
                name="nascimento"
                min="1920-01-01"
                max="2027-01-01"
        />

        <br>

        <label for="satisfacao" >Nivel de Satisfação:</label><br>
        <input type="range"
                id="satisfacao"
                name="satisfacao"
                min="0"
                max="100"
                step="10"
                value="50"
        />

        <br>

        <label for="cor">Cor Favorita</label><br>
        <input type="color"
                id="cor"
                name="cor"
                value="0080ff"
        />

        <br>

        <label for="cidade">Cidade</label><br>
        <input type="text"
                id="cidade"
                name="cidade"
                list="lista-cidade"
                placeholder="Digite sua busca"
                <datalist id="lista-cidade">
                    <option value="Sao Paulo">São Paulo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Belo Horizonte">Belo Horizonte</option>
                    <option value="Curitiba">Curitiba</option>
                    <option value="Porto Alegre">Porto Alegre</option>
                    <option value="Brasília">Brasília</option>
                </datalist>
                />
        <button type="submit">Enviar</button><br>
    </form>
</body>

</html>
